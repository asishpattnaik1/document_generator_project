[project]
name = "reflectdoc"
version = "0.1.0"
description = "Reflection-based documentation generator with CLI and REST API"
readme = "README.md"
authors = [
    { name = "asishpattnaik1", email = "asishpattnaik1@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "click>=8.1.7",
    "pydantic>=2.9.0",
    "openai>=1.54.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
]

[project.scripts]
reflectdoc = "reflectdoc.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
